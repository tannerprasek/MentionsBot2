<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which show? · CastBot</title>
<style>
  :root { --bg: #f5f5f7; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e2e2e7; --accent: #0a66ff; --chip: #eef2ff; --thumb: #dcdce2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #181b21; --text: #ececf1; --muted: #9a9aa6; --line: #2a2e37; --accent: #4c8dff; --chip: #1f2633; --thumb: #252a33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 22px; margin: 14px 0 4px; letter-spacing: -0.02em; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { display: flex; gap: 14px; align-items: center; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin: 12px 0; color: inherit; }
  .card:active { background: var(--chip); }
  .card img, .card .ph { width: 72px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 8px; background: var(--thumb); flex: none; }
  .card strong { display: block; font-size: 17px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 6px; padding: 1px 7px; margin: 4px 6px 0 0; font-size: 12px; }
  .go { margin-left: auto; font-size: 22px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <a href="/">‹ CastBot</a>
  <h1 id="h">Which show?</h1>
  <div class="muted small" id="sub">Loading…</div>
  <div id="list"></div>
</main>
<script>
const $ = (id) => document.getElementById(id)
const qs = new URLSearchParams(location.search)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const token = (() => { try { return localStorage.getItem('token') || '' } catch { return '' } })()

fetch('/api/shows?q=' + encodeURIComponent(qs.get('q') || ''), { headers: token ? { Authorization: 'Bearer ' + token } : {} })
  .then((r) => r.json())
  .then((shows) => {
    if (!Array.isArray(shows) || !shows.length) { $('sub').textContent = 'No shows found.'; return }
    $('h').textContent = `Which “${qs.get('q')}”?`
    $('sub').textContent = `${shows.length} shows match. Pick yours.`
    $('list').innerHTML = shows.map((s) => {
      const years = s.year ? (s.status === 'Ended' && s.ended && s.ended !== s.year ? `${s.year}–${s.ended}` : s.status === 'Ended' ? s.year : `${s.year}–`) : ''
      return `<a class="card" href="/show.html?id=${s.id}${qs.get('tv') ? '&tv=' + encodeURIComponent(qs.get('tv')) : ''}">
        ${s.poster ? `<img loading="lazy" src="${esc(s.poster)}" alt="">` : '<div class="ph"></div>'}
        <span><strong>${esc(s.name)}</strong>
        ${years ? `<span class="chip">${esc(years)}</span>` : ''}${s.country ? `<span class="chip">${esc(s.country)}</span>` : ''}${s.network ? `<span class="chip">${esc(s.network)}</span>` : ''}</span>
        <span class="go">›</span></a>`
    }).join('')
  })
  .catch(() => { $('sub').textContent = "Couldn't load shows." })
</script>
</body>
</html>
